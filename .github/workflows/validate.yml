name: Validate Vue and FastAPI sample

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: python -m pip check
      - run: npm --prefix web ci --ignore-scripts
      - run: python -m pytest
        working-directory: api
      - run: npm --prefix web run build
      - run: node --test fullstack.test.mjs
      - name: Export exact pinned local-validation prerequisite
        if: github.ref == 'refs/heads/sample-ux-refresh' && runner.os == 'Linux'
        run: python -m pip download --no-deps --only-binary=:all: fastapi==0.162.2 --dest .validation-prerequisites
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/sample-ux-refresh' && runner.os == 'Linux'
        with:
          name: exact-local-validation-prerequisite
          path: .validation-prerequisites/*
          include-hidden-files: true
          retention-days: 1
